<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <title>Некорректный запрос (400 Bad Request) — Vanilla Mafia</title>
    <!-- This file lives in public/400.html. It is served without the app, so the warm paper look of errors/show
         is copied here in plain CSS, kept simple enough for the old browsers the 406 page is shown to. -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        background: #faf6ec;
        color: #2a2418;
        font-family: Roboto, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1rem;
        text-align: center;
      }
      .code {
        color: #e0cf9f;
        font-family: "PT Serif", Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
      }
      .rule {
        display: block;
        width: 3rem;
        height: 2px;
        margin: 1.5rem auto 0;
        border-radius: 9999px;
        background: #d9a21b;
      }
      h1 {
        margin-top: 1.5rem;
        font-family: "PT Serif", Georgia, "Times New Roman", serif;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin-top: 0.5rem;
        color: #736650;
        font-size: 15px;
      }
      .other-language {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #e6dcc4;
      }
      .other-language h2 {
        font-size: 15px;
        font-weight: 600;
      }
      .home {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.625rem 1rem;
        border-radius: 0.375rem;
        background: #2a2418;
        color: #f3c94f;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .home:focus { outline: 2px solid #2a2418; outline-offset: 2px; }
      @media (min-width: 64rem) {
        main { padding-top: 6rem; padding-bottom: 6rem; }
        .code { font-size: 112px; }
        h1 { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">400</p>
      <span class="rule" aria-hidden="true"></span>
      <h1>Некорректный запрос</h1>
      <p>Сервер не может обработать запрос. Проверьте адрес и попробуйте ещё раз.</p>
      <div class="other-language" lang="en">
        <h2>Bad request</h2>
        <p>The server cannot process the request. Check the address and try again.</p>
      </div>
      <a class="home" href="/">На главную</a>
    </main>
  </body>
</html>
