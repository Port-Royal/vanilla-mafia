      game-breakdown:
        title: "Разборы игр"
        summary: "Как записать пофазный разбор игры: рассадка, речи, ходы, голосования и ночи"
        intro: "Разбор — это хронология игры: фазы, события и ходы игроков. Он нужен для анализа любой игры, в том числе чужой, где игроки не заведены на сайте."
        difference_title: "Чем разбор отличается от протокола"
        difference_description: "Протокол фиксирует итог игры и баллы. Разбор фиксирует ход игры: кто когда говорил, что заявлял, кого выставлял, как голосовали и что происходило ночью. Это разные записи об одной игре, и они не заменяют друг друга."
        create_title: "Как создать разбор"
        create_step_metadata: "Заполните название, дату, источник (турнир, стрим), ссылку на видео и ведущего."
        create_step_roles_mode: "Выберите режим ролей — открытые или закрытые."
        create_step_game: "При желании привяжите клубную игру: рассадка подтянется из её протокола."
        create_step_seats: "Проверьте рассадку: имена вводятся свободным текстом, подсказки предлагают игроков с сайта, роль можно оставить пустой."
        create_note: "Разбор сразу создаётся с десятью местами и нулевым кругом. Всё остальное добавляется по ходу заполнения."
        roles_mode_title: "Открытые и закрытые роли"
        roles_mode_open: "Открытые роли — известно, кто есть кто. В ночи записываются выстрелы каждого живого мафиози при промахе, проверки дона и шерифа; результат проверки выводится из роли проверенного."
        roles_mode_closed: "Закрытые роли — известен только утренний итог ночи: убийство или промах. Проверки в этом режиме существуют лишь как дневные заявления игроков и могут быть ложными."
        phases_title: "Фазы"
        phases_description: "Фазы добавляются вручную кнопкой «+ следующая фаза». Названия и число живых считаются автоматически."
        phases_night: "Ночь создаётся пустой."
        phases_day: "День создаётся сразу с прощальной речью убитого ночью (если он есть) и речами всех живых в порядке хода."
        phases_delete: "Удалить можно только последнюю фазу — вместе со всем её содержимым."
        automatic_title: "Что редактор достраивает сам"
        automatic_description: "После каждого изменения редактор добавляет блоки, которых требует ход игры:"
        automatic_main_round: "появились выставления — создаётся голосование (кроме единственной кандидатуры в нулевом круге);"
        automatic_revote: "равенство голосов — добавляются оправдательные речи кандидатов и переголосование;"
        automatic_lift: "переголосование снова закончилось равенством всех кандидатов — добавляется подъём, без речей;"
        automatic_farewell: "игрок покинул игру по голосованию — добавляется его прощальная речь."
        automatic_no_deletion: "Ничего не удаляется автоматически. Если правка сделала блок лишним, он остаётся и помечается предупреждением — удалить или изменить его нужно вручную."
        warnings_title: "Предупреждения"
        warnings_description: "Нарушения правил подсвечиваются, но никогда не мешают сохранить разбор: задача разбора — записать то, что произошло на самом деле, включая нарушения."
        result_title: "Результат"
        result_description: "Если у всех мест указаны роли, результат считается автоматически. Если нет — выберите его вручную в нижней части редактора."
        view_title: "Просмотр"
        view_description: "Готовый разбор открывается отдельной страницей только для чтения: рассадка с ролями, компактная хронология, предупреждения, результат и выводы."
      podcast-feed:
        title: "Подключение подкаста"
        summary: "Как добавить RSS-ленту подкаста в приложение для прослушивания"
        intro: "Скопируйте вашу персональную RSS-ссылку со страницы подкаста и добавьте её в приложение для подкастов."
