    pages:
      live-protocol:
        title: "Живой протокол"
        summary: "Как вести игру с клавиатуры: раздача, речи, голосования, ночи и конец игры"
        intro: "Живой протокол записывает ход игры прямо за столом. Каждое действие судьи становится записью в журнале, а роли, статусы, лучший ход и результат сами попадают в протокол и на оверлей."
        start_title: "Как начать"
        start:
          - "Создайте протокол в обычной форме: турнир, номер игры, игроки по местам. Роли можно не указывать."
          - "Новая игра в процессе откроется в живом протоколе. Из формы правки в него ведёт ссылка «Живой протокол»."
          - "Раздайте роли и запишите договорку, дальше игра идёт по этапам."
        keys_title: "Клавиши"
        keys_intro: "Сначала клавиша действия, потом номера мест. 0 — это место 10. Действие с одним номером сохраняется сразу, с несколькими — по Enter. Esc отменяет. Клавиши работают в любой раскладке. Всё то же можно сделать мышью: на каждой кнопке подписана её клавиша."
        key: "Клавиша"
        action: "Действие"
        stages:
          all: "На любом этапе игры"
          roles: "Раздача ролей"
          deal: "Договорка"
          speech: "Речи"
          vote: "Голосование"
          night: "Ночь"
          leaving: "Лучший ход и уходящая речь"
        rows:
          all:
            - ["F, G, X", "фол, техфол, удаление; номер или Enter для говорящего"]
            - ["Shift+F, Shift+G", "снять последний фол или техфол"]
            - ["Ctrl+Z", "отменить последнее действие"]
            - ["H", "удерживать, чтобы увидеть роли"]
            - ["Q", "завершить игру, когда результат определился"]
            - ["Shift+D", "завершить игру ничьей"]
          roles:
            - ["номера", "дон, шериф, мафия, мафия"]
            - ["Enter", "сохранить; без номеров — подтвердить роли из формы"]
          deal:
            - ["S, D", "статика или динамика"]
            - ["номер", "кто вскроется шерифом"]
            - ["W", "поле для текста"]
            - ["Enter", "начать нулевой круг"]
          speech:
            - ["S, R, T, C", "подозрение, красный, команда, запрос проверки; номера и Enter"]
            - ["N", "выставить игрока"]
            - ["Shift+N", "снять кандидатуру"]
            - ["M", "заметка"]
            - ["Space", "следующий игрок"]
            - ["V", "к голосованию раньше конца круга"]
            - ["клик по месту", "сделать игрока говорящим"]
          vote:
            - ["номера", "отметить голосующих за текущего кандидата"]
            - ["Enter", "к следующему кандидату или подвести итог"]
          night:
            - ["номер", "в кого стреляли все чёрные"]
            - ["M", "промах: потом номер, − «не стрелял» или T «тактический» для каждого"]
            - ["номер или Enter", "проверка дона и шерифа или «не проверял»"]
          leaving:
            - ["три номера", "лучший ход; Enter без номеров — «не назвал»"]
            - ["текст и Enter", "завещание: 234к, 67ч, 9ш"]
            - ["Enter на пустом поле", "дальше"]
            - ["B", "записать лучший ход, когда он не предложен"]
        undo_title: "Исправление ошибок"
        undo: "Ctrl+Z отменяет последнее действие целиком, вместе со всем, что оно вызвало. Запись из середины можно удалить крестиком в «Ходе игры», если от неё ничего не зависит: подозрения, заметки, завещания, лучший ход, выставление до голосования."
        roles_title: "Скрытие ролей"
        roles: "Днём экран не показывает роли, проверки и договорку, чтобы их не увидели за столом. Удерживайте H, чтобы посмотреть. Ночью и в договорке роли видны: игроки в масках. После игры всё раскрыто. Настройка «Скрыть роли» в форме относится только к оверлею."
        network_title: "Связь с сервером"
        network: "Записи уходят на сервер по очереди и не теряются при обрыве связи или перезагрузке страницы. Состояние видно сверху справа. Если сервер отклонил запись, экран это покажет: обновите страницу."
        after_title: "После игры"
        after: "«Завершить игру» записывает результат и открывает форму с баллами. Во вкладке «Бланк» собраны стрельба, проверки, голосования, завещания и лучшие ходы. Если открыть завершённую игру снова, номер или клик по месту покажет события одного игрока."
      obs-overlay:
        title: "Настройка OBS-оверлея"
        summary: "Как настроить оверлей игры как источник браузера в OBS"
        setup_title: "Настройка в OBS"
        step_open_obs: "Откройте OBS Studio и перейдите к сцене, где будет оверлей."
        step_add_source: "Нажмите + в панели источников и выберите «Браузер»."
        step_enter_url: "Введите URL оверлея стола:"
        url_example: "https://vanilla-mafia.ru/overlay"
        url_hint: "Это стол 1 — к нему же относятся игры без номера стола. Для других столов: /overlay/tables/2, /overlay/tables/3 и так далее. Ссылку стола можно скопировать в протоколе."
        table_follow: "Ссылка стола сама следует за играми: показывает сегодняшнюю игру в процессе за этим столом, после финала держит её на экране, пока не начнётся следующая, и переключается без правки источника в OBS. Пока за столом нет игр, оверлей прозрачный."
        game_url_hint: "Оверлей одной игры по-прежнему доступен по адресу страницы игры с /overlay в конце:"
        game_url_example: "https://vanilla-mafia.ru/games/season-6-series-1-game-3/overlay"
        step_set_size: "Укажите ширину и высоту, равные базовому разрешению холста OBS (Настройки → Видео), например 1920×1080."
        step_position: "Нажмите на источник правой кнопкой → Преобразовать → Сбросить преобразование, чтобы он занял весь холст с точки 0,0. Не растягивайте рамку источника вручную: оверлей сам размещает заголовок и карточки игроков, а карточки сохраняют пропорции при любом размере."
        step_done: "Нажмите OK. Оверлей будет обновляться в реальном времени по мере заполнения протокола судьёй."
        recommended_title: "Рекомендуемые настройки"
        setting_width: "Ширина"
        setting_width_value: "ширина холста OBS, например 1920 px"
        setting_height: "Высота"
        setting_height_value: "высота холста OBS, например 1080 px"
        setting_fps: "FPS"
        setting_css: "Пользовательский CSS"
        display_title: "Настройки отображения"
        display_description: "Что показывать на оверлее, судья выбирает в протоколе игры, в строке «Оверлей». Изменения появляются на оверлее сразу, перезагружать источник в OBS не нужно."
        display_hide_roles: "Пока игра идёт, роли не попадают на оверлей: значков ролей и проверок нет, а лучший ход, выставленные и отстрел показываются без цветов команд. После игры всё раскрывается."
        display_hide_game_info: "Скрывает блок «Игра N/M» сверху по центру."
        display_hide_table_info: "Скрывает блок «Стол N» сверху слева. Судья сверху справа показывается всегда."
        display_game_number: "«Игра N/M» берётся из полей протокола «Номер игры» и «Всего игр»; пока общее число игр не указано, показывается «Игра N»."
        judge_title: "Руководство для судьи"
        judge_step_open: "Откройте страницу протокола для игры, которую вы ведёте."
        judge_step_enable: "Включите переключатель LIVE автосохранения в форме протокола."
        judge_step_fill: "Заполняйте имена игроков, роли, статусы и места лучшего хода по ходу игры."
        judge_step_auto: "Изменения сохраняются и передаются на оверлей автоматически."
        blocks_title: "Что показывает оверлей"
        blocks_description: "Кроме плиток игроков, оверлей получает данные из живого протокола:"
        block_badges: "Значки ролей на плитках: шериф жёлтый, мафия и дон чёрные; у мирных значка нет."
        block_fouls: "Фолы — жёлтые точки, техфолы — красные ромбы вверху плитки."
        block_eliminated: "Фото выбывшего игрока затемняется и опускается под полосу с ником."
        block_best_move: "Лучший ход внизу плитки: красные и чёрные ячейки по ролям названных игроков."
        block_nominees: "Справа сверху — «Выставлены»: номера кандидатов дня в порядке выставления. Очищается с началом ночи."
        block_night: "Слева сверху — ночи по столбцам: отстрел, проверки дона и проверки шерифа. Промах и пропущенная проверка показаны крестиком."
        realtime_title: "Обновления в реальном времени"
        realtime_description: "Оверлей получает обновления в реальном времени через WebSocket. Как только судья сохраняет изменение в протоколе, оно появляется на оверлее — без перезагрузки страницы."
      game-breakdown:
        title: "Разборы игр"
        summary: "Как записать пофазный разбор игры: рассадка, речи, ходы, голосования и ночи"
        intro: "Разбор — это хронология игры: фазы, события и ходы игроков. Он нужен для анализа любой игры, в том числе чужой, где игроки не заведены на сайте."
        difference_title: "Чем разбор отличается от протокола"
        difference_description: "Протокол фиксирует итог игры и баллы. Разбор фиксирует ход игры: кто когда говорил, что заявлял, кого выставлял, как голосовали и что происходило ночью. Это разные записи об одной игре, и они не заменяют друг друга."
        create_title: "Как создать разбор"
        create_step_metadata: "Заполните название (в него удобно вписать турнир), дату, ссылку на видео и судью."
        create_step_roles_mode: "Выберите режим ролей — открытые или закрытые."
        create_step_game: "При желании привяжите клубную игру: рассадка подтянется из её протокола."
        create_step_seats: "Проверьте рассадку: имена вводятся свободным текстом, подсказки предлагают игроков с сайта, роль можно оставить пустой."
        create_note: "Разбор сразу создаётся с десятью местами и нулевым кругом. Всё остальное добавляется по ходу заполнения."
        roles_mode_title: "Открытые и закрытые роли"
        roles_mode_open: "Открытые роли — известно, кто есть кто. В ночи записываются выстрелы каждого живого мафиози при промахе (цель, «не стрелял» или «тактический промах» — намеренный демонстративный промах), проверки дона и шерифа; результат проверки выводится из роли проверенного."
        roles_mode_closed: "Закрытые роли — известен только утренний итог ночи: убийство или промах. Проверки в этом режиме существуют лишь как дневные заявления игроков (ход «Проверка в стол»: проверенный игрок и цвет) и могут быть ложными."
        phases_title: "Фазы"
        phases_description: "Фазы добавляются вручную кнопкой «+ следующая фаза». Названия и число живых считаются автоматически."
        phases_night: "Ночь создаётся пустой."
        phases_day: "День создаётся сразу с прощальной речью убитого ночью (если он есть) и речами всех живых в порядке хода."
        phases_delete: "Удалить можно только последнюю фазу — вместе со всем её содержимым."
        phases_fouls: "Фол записывается ходом «Фол» на любого игрока, не только на говорящего. Количество фолов видно у каждого места в «Рассадке», а в самом ходе — его номер для этого игрока (например, «Фол · 3-й»)."
        phases_speech_summary: "В каждой речи есть поле «Суть речи» — кратко запишите, что сказал игрок. Оно сохраняется само и может оставаться пустым; в режиме просмотра пустое поле не показывается."
        automatic_title: "Что редактор достраивает сам"
        automatic_description: "После каждого изменения редактор добавляет блоки, которых требует ход игры:"
        automatic_main_round: "появились выставления — создаётся голосование (кроме единственной кандидатуры в нулевом круге);"
        automatic_revote: "равенство голосов — добавляются оправдательные речи кандидатов и переголосование;"
        automatic_lift: "переголосование снова закончилось равенством всех кандидатов — добавляется подъём, без речей. В подъёме у каждого игрока только «не голосовал» или «За»; подъём состоялся, когда «За» больше половины живых игроков;"
        automatic_farewell: "игрок покинул игру по голосованию — добавляется его прощальная речь."
        automatic_no_deletion: "Ничего не удаляется автоматически. Если правка сделала блок лишним, он остаётся и помечается предупреждением — удалить или изменить его нужно вручную."
        warnings_title: "Предупреждения"
        warnings_description: "Нарушения правил подсвечиваются, но никогда не мешают сохранить разбор: задача разбора — записать то, что произошло на самом деле, включая нарушения."
        warnings_broken_vote: "Если в нулевом круге голосование сломали (ход «Слом голосования» — в речи или в блоке голосования), покинувший стол игрок получает право на лучший ход. Если игрок сломал голосование в себя, права нет (7.5.8) — укажите себя в поле «В кого сломал»."
        result_title: "Результат"
        result_description: "Если у всех мест указаны роли, результат считается автоматически. Если нет — выберите его вручную в нижней части редактора."
        view_title: "Просмотр"
