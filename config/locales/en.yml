  help:
    index:
      title: "Help"
    pages:
      live-protocol:
        title: "Live protocol"
        summary: "How to run a game from the keyboard: roles, speeches, votes, nights and the end of the game"
        intro: "The live protocol records the game at the table. Every action of the judge becomes a journal record, and roles, statuses, the best move and the result reach the protocol and the overlay by themselves."
        start_title: "Getting started"
        start:
          - "Create a protocol in the usual form: tournament, game number, players by seat. Roles are optional."
          - "A new game in progress opens in the live protocol. The edit form links to it as well."
          - "Deal the roles and record the mafia deal, then the game goes stage by stage."
        keys_title: "Keys"
        keys_intro: "An action key first, then seat numbers. 0 is seat 10. An action with one seat saves at once, with several on Enter. Esc cancels. Keys work in any keyboard layout. Everything works with the mouse too: every button shows its key."
        key: "Key"
        action: "Action"
        stages:
          all: "At any stage of the game"
          roles: "Dealing roles"
          deal: "Mafia deal"
          speech: "Speeches"
          vote: "Vote"
          night: "Night"
          leaving: "Best move and leaving speech"
        rows:
          all:
            - ["F, G, X", "foul, technical foul, removal; a seat or Enter for the speaker"]
            - ["Shift+F, Shift+G", "cancel the last foul or technical foul"]
            - ["Ctrl+Z", "undo the last action"]
            - ["H", "hold to see the roles"]
            - ["Q", "finish the game once the result is known"]
            - ["Shift+D", "finish the game as a draw"]
          roles:
            - ["seats", "don, sheriff, mafia, mafia"]
            - ["Enter", "save; with no seats, confirm the roles from the form"]
          deal:
            - ["S, D", "static or dynamic"]
            - ["seat", "who will claim sheriff"]
            - ["W", "text field"]
            - ["Enter", "start the zero circle"]
          speech:
            - ["S, R, T, C", "suspect, red, team, check request; seats and Enter"]
            - ["N", "nominate a player"]
            - ["Shift+N", "cancel a nomination"]
            - ["M", "note"]
            - ["Space", "next player"]
            - ["V", "go to the vote before the circle ends"]
            - ["click a seat", "make that player the speaker"]
          vote:
            - ["seats", "mark the voters for the current candidate"]
            - ["Enter", "next candidate or the result"]
          night:
            - ["seat", "who all the blacks shot"]
            - ["M", "miss: then a seat, − \"did not shoot\" or T \"tactical\" for each shooter"]
            - ["seat or Enter", "the don's and the sheriff's check, or no check"]
          leaving:
            - ["three seats", "best move; Enter with none means \"named nobody\""]
            - ["text and Enter", "will: 234к, 67ч, 9ш"]
            - ["Enter on an empty field", "move on"]
            - ["B", "record a best move that was not offered"]
        undo_title: "Fixing mistakes"
        undo: "Ctrl+Z undoes the last action as a whole, with everything it caused. A record in the middle can be deleted with the cross in the game record if nothing depends on it: suspicions, notes, wills, best moves, nominations before the vote."
        roles_title: "Hiding roles"
        roles: "By day the screen shows no roles, checks or deal, so nobody at the table sees them. Hold H to look. At night and during the deal roles show: the players wear masks. After the game everything is open. The \"Hide roles\" setting in the form only affects the overlay."
        network_title: "Connection"
        network: "Records go to the server one by one and survive a lost connection or a reload. The state shows in the top right. If the server refuses a record, the screen says so: reload the page."
        after_title: "After the game"
        after: "\"Finish the game\" records the result and opens the form for points. The Sheet tab gathers shooting, checks, votes, wills and best moves. When you open a finished game again, a seat number or a click shows one player's events."
      obs-overlay:
        title: "OBS Overlay Setup"
        summary: "How to set up the game overlay as an OBS browser source"
        setup_title: "Setup in OBS"
        step_open_obs: "Open OBS Studio and go to the scene where you want the overlay."
        step_add_source: "Click + in the Sources panel and choose Browser."
        step_enter_url: "Enter the overlay URL of the table:"
        url_example: "https://vanilla-mafia.ru/overlay"
        url_hint: "This is table 1, which also takes games without a table number. For other tables: /overlay/tables/2, /overlay/tables/3 and so on. The protocol has a button that copies the table link."
        table_follow: "The table link follows the games by itself: it shows today's game in progress at that table, keeps it on screen after the final reveal until the next game starts, and switches without editing the OBS source. While the table has no game, the overlay stays transparent."
        game_url_hint: "A single game's overlay is still available at the game page address with /overlay at the end:"
        game_url_example: "https://vanilla-mafia.ru/games/season-6-series-1-game-3/overlay"
        step_set_size: "Set the width and height to the OBS canvas base resolution (Settings → Video), for example 1920×1080."
        step_position: "Right-click the source → Transform → Reset Transform so it covers the whole canvas from 0,0. Do not stretch the source frame by hand: the overlay positions the header and player tiles itself, and tiles keep their proportions at any size."
        step_done: "Click OK. The overlay will update in real time as the judge fills in the protocol."
        recommended_title: "Recommended Settings"
        setting_width: "Width"
        setting_width_value: "OBS canvas width, e.g. 1920 px"
        setting_height: "Height"
        setting_height_value: "OBS canvas height, e.g. 1080 px"
        setting_fps: "FPS"
        setting_css: "Custom CSS"
        display_title: "Display settings"
        display_description: "The judge chooses what the overlay shows in the game protocol, in the “Overlay” row. Changes appear on the overlay immediately; there is no need to reload the source in OBS."
        display_hide_roles: "While the game runs, roles do not reach the overlay: there are no role badges and no checks, and the best move, the nominees and the shots show without team colours. After the game everything is revealed."
        display_hide_game_info: "Hides the “Game N/M” block at the top centre."
        display_hide_table_info: "Hides the “Table N” block at the top left. The judge at the top right is always shown."
        display_game_number: "“Game N/M” comes from the protocol’s “Game number” and “Total games” fields; until the total is set, the overlay shows “Game N”."
        judge_title: "Guide for Judges"
        judge_step_open: "Open the game protocol page for the game you are judging."
        judge_step_enable: "Enable the LIVE autosave toggle in the protocol form."
        judge_step_fill: "Fill in player names, roles, statuses and best move seats as the game goes."
        judge_step_auto: "Changes are saved and broadcast to the overlay automatically."
        blocks_title: "What the overlay shows"
        blocks_description: "Besides the player tiles, the overlay takes data from the live protocol:"
        block_badges: "Role badges on the tiles: the sheriff yellow, civilians red, mafia and don black."
        block_fouls: "Fouls as yellow dots, technical fouls as red diamonds at the top of the tile."
        block_eliminated: "An eliminated player's photo dims and sinks under the name bar."
        block_best_move: "The best move at the bottom of the tile: red and black cells by the roles of the named players."
        block_nominees: "Top right, \"Nominated\": the day's candidates in nomination order. Cleared when the night begins."
        block_night: "Top left, nights by column: the shot, the don's checks and the sheriff's checks. A miss and a skipped check show as a cross."
        realtime_title: "Real-Time Updates"
        realtime_description: "The overlay receives live updates via WebSocket. As soon as the judge saves a change in the protocol, it appears on the overlay — no page refresh needed."
      game-breakdown:
        title: "Game breakdowns"
        summary: "How to record a phase-by-phase breakdown: seating, speeches, moves, votings and nights"
        intro: "A breakdown is the chronology of a game: its phases, events and player moves. It exists to analyse any game, including someone else's, where the players are not registered on the site."
        difference_title: "How a breakdown differs from a protocol"
        difference_description: "A protocol records the outcome of a game and its points. A breakdown records the flow: who spoke when, what they claimed, whom they nominated, how the table voted and what happened at night. They are two different records of one game and neither replaces the other."
        create_title: "Creating a breakdown"
        create_step_metadata: "Fill in the title (a good place for the tournament name), date, video link and judge."
        create_step_roles_mode: "Choose the roles mode — open or closed."
        create_step_game: "Optionally link a club game: the seating is pre-filled from its protocol."
        create_step_seats: "Check the seating: names are free text with suggestions from the site's players, and a role may be left empty."
        create_note: "A breakdown is created with ten seats and the zero round already in place. Everything else is added as you go."
        roles_mode_title: "Open and closed roles"
        roles_mode_open: "Open roles — who is who is known. The night records the shot of every living mafia member on a miss (a target, \"did not shoot\" or \"tactical miss\" — a deliberate, demonstrative miss), plus the don and sheriff checks; a check result is derived from the role of the seat checked."
        roles_mode_closed: "Closed roles — only the morning outcome is known: a kill or a miss. Checks exist only as claims players make during the day (the \"Check to the table\" move: the checked player and the colour), and those may be false."
        phases_title: "Phases"
        phases_description: "Phases are added by hand with the \"+ next phase\" button. Labels and alive counts are derived automatically."
        phases_night: "A night is created empty."
        phases_day: "A day is created with the farewell speech of the seat killed at night (when there is one) and the speeches of everyone alive, in speaking order."
        phases_delete: "Only the last phase can be deleted, together with everything in it."
        phases_fouls: "A foul is recorded with the \"Foul\" move for any player, not only the speaker. Each seat in the seating panel shows its foul count, and the move itself shows its number for that player (e.g. \"Foul · #3\")."
        phases_speech_summary: "Every speech has a \"Speech summary\" field for the gist of what the player said. It saves on its own and may stay empty; an empty one is not shown in the read-only view."
        automatic_title: "What the editor builds for you"
        automatic_description: "After each change the editor adds the blocks the game now calls for:"
        automatic_main_round: "nominations appeared — a voting round is created (except for a single nominee in the zero round);"
        automatic_revote: "the votes tied — justification speeches for the tied candidates and a revote are added;"
        automatic_lift: "the revote tied again among all of its candidates — a lift is added, with no speeches. In a lift each player is either \"did not vote\" or \"For\"; the lift passes when more than half of the alive players are \"For\";"
        automatic_farewell: "a player left by vote — their farewell speech is added."
        automatic_no_deletion: "Nothing is ever deleted automatically. If a correction leaves a block obsolete, it stays and is flagged with a warning; removing or editing it is up to you."
        warnings_title: "Warnings"
        warnings_description: "Rule violations are highlighted but never prevent saving: the point of a breakdown is to record what actually happened, violations included."
        warnings_broken_vote: "When the vote in the zero round is broken (the \"Broken vote\" move, in a speech or in the vote round block), the player who leaves the table gets the right to a best move. A player who broke the vote onto themselves has no such right (7.5.8) — enter their own seat in \"Broken onto\"."
        result_title: "Result"
        result_description: "When every seat has a role the result is computed automatically. Otherwise choose it by hand at the bottom of the editor."
        view_title: "Reading a breakdown"
        view_description: "A finished breakdown has its own read-only page: the seating with roles, a compact chronology, the warnings, the result and the conclusions. Above the chronology you can pick a player: only the events involving them remain — their speeches and moves, other players' moves and votes about them, night events they took part in; phases without such events are hidden. The filtered page has its own address you can share."
      podcast-feed:
        title: "Podcast Feed Setup"
        summary: "How to add the podcast RSS feed to your listening app"
        intro: "Copy your personal RSS link from the podcast page and add it to your podcast app."
        apple_title: "Apple Podcasts"
        apple_step_library: "Open Apple Podcasts and go to your Library."
        apple_step_search: "Tap the menu (···) in the top right and select 'Follow a Show by URL'."
        apple_step_paste: "Paste your personal RSS link."
        apple_step_subscribe: "Tap 'Follow'. Episodes will appear in your Library."
        pocket_casts_title: "Pocket Casts"
        pocket_casts_step_search: "Open Pocket Casts and go to the search section."
        pocket_casts_step_rss: "Tap 'Add by URL' (or the link icon)."
        pocket_casts_step_paste: "Paste your personal RSS link."
        pocket_casts_step_subscribe: "Tap 'Subscribe'."
        castbox_title: "Castbox"
        castbox_step_search: "Open Castbox and go to search."
        castbox_step_rss: "Scroll down and tap 'RSS Feed'."
        castbox_step_paste: "Paste your personal RSS link."
        castbox_step_subscribe: "Tap 'Subscribe'."
        generic_title: "Other Apps"
        generic_step_find: "Find the 'Add by RSS' or 'Add by URL' option in your app."
        generic_step_paste: "Paste your personal RSS link."
        generic_step_subscribe: "Confirm the subscription. Episodes will load automatically."
        privacy_title: "Privacy"
        privacy_description: "Your RSS link is tied to your account. Do not share it with others — you can revoke it and get a new one if needed."
